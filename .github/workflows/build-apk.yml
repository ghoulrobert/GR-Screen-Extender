name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      GRADLE_HOME: /opt/gradle
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup local.properties
      working-directory: ./client
      run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

    - name: Download and Setup Gradle
      run: |
        echo "Downloading Gradle 8.7..."
        curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip || exit 1
        unzip -q gradle.zip -d /opt/
        rm gradle.zip
        echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
        export PATH="/opt/gradle-8.7/bin:$PATH"
        gradle --version
      shell: bash

    - name: Build Debug APK
      working-directory: ./client
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ScreenExtender-debug.apk
        path: client/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
