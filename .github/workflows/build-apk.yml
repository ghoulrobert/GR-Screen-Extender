name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('client/**/*.gradle*', 'client/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      working-directory: ./client
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: ./client
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Display build output
      working-directory: ./client
      run: |
        echo "=== Checking for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null
        echo ""
        echo "=== APK output directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory does not exist"
      shell: bash

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GR扩展屏幕-debug.apk
        path: client/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
