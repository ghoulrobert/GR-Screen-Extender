name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('client/**/*.gradle*', 'client/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup and debug
      working-directory: ./client
      run: |
        echo "=== File listing ==="
        ls -la
        echo ""
        echo "=== gradlew permissions ==="
        ls -la gradlew
        echo ""
        echo "=== gradlew first line ==="
        head -1 gradlew | cat -A
        echo ""
        echo "=== Java version ==="
        java -version
        echo ""
        echo "=== JAVA_HOME ==="
        echo $JAVA_HOME
        echo ""
        echo "=== ANDROID_HOME ==="
        echo $ANDROID_HOME
        echo ""
        echo "=== local.properties ==="
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        cat local.properties
      shell: bash

    - name: Test gradlew
      working-directory: ./client
      run: |
        chmod +x gradlew
        echo "=== Running gradlew --version ==="
        ./gradlew --version 2>&1 || echo "EXIT CODE: $?"
      shell: bash

    - name: Build Debug APK
      working-directory: ./client
      run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: GR扩展屏幕-debug.apk
        path: client/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
