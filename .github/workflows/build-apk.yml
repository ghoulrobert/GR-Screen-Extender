name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup local.properties
      working-directory: ./client
      run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.7
        build-root-directory: client
        gradle-home-cache-cleanup: true
        cache-disabled: true

    - name: Build and capture output
      working-directory: ./client
      run: |
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        echo "GRADLE_EXIT=$?" >> $GITHUB_ENV
        echo ""
        echo "=== LAST 100 LINES ==="
        tail -100 /tmp/build.log
        echo ""
        echo "=== APK FILES ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK found"
      shell: bash

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ScreenExtender-debug.apk
        path: client/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
